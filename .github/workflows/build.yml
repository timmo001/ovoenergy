---
name: "Build"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-python-linux.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
