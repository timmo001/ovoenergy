---
name: "Build"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-python-linux.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2
