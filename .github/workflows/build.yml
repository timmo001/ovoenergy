---
name: "Build"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-python-linux.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1
