---
name: "CodeQL"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze-python:
    uses: timmo001/workflows/.github/workflows/codeql-python.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
